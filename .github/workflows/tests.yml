name: Homebrew tap tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  audit:
    name: Audit formula
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit formula
        run: |
          brew tap horus-ci/tap "$PWD"
          brew audit --strict horus-ci/tap/horus
          brew untap horus-ci/tap 2>/dev/null || true

  test:
    name: Install and test formula
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install published formula
        run: |
          brew tap horus-ci/tap "$PWD"
          brew install --build-from-source horus-ci/tap/horus

      - name: Test formula
        run: brew test horus-ci/tap/horus
